[package]
name = "codescratch"
version = "0.1.0"
edition = "2021"
description = "Local code structure graph for AI agents — TS/JS, SQLite, CLI. Single static binary."
license = "MIT"

[[bin]]
name = "codescratch"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }   # bundled build enables FTS5
ignore = "0.4"
blake3 = "1"
tree-sitter = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
notify = "6"                    # WP-2C native watcher
tree-sitter-python = "0.23"     # WP-4A python extractor

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
